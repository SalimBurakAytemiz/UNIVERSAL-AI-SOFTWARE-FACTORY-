# //TR: YALNIZ TANI workflow'u (merge edilmez; yalniz ci/diagnose-shards dalina push ile calisir): her canonical vitest adimini iki isletim sisteminde ayri isle dogrudan calistirarak run-validation'in ilk hatada durmasi yuzunden gizli kalan tum hatalari tek turda gosterir. GitHub-hosted, secret yok, contents:read, artifact yok. Governance kaniti veya PASS DEGILDIR; canonical kapi ci.yml'dir.
name: Diagnose canonical test steps (diagnosis only)
on:
  push:
    branches: [ci/diagnose-shards]
permissions:
  contents: read
jobs:
  step:
    name: diag ${{ matrix.step }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        step: [tests, tests-2, tests-3, tests-4, tests-5, tests-6, tests-7, tests-8, tests-bs1-a, tests-bs1-b, tests-bs1-c, tests-bs1-d, tests-bs1-e, tests-bs1-f, tests-lv1, post]
        exclude:
          - {os: ubuntu-latest, step: tests-bs1-a}
          - {os: ubuntu-latest, step: tests-bs1-b}
          - {os: ubuntu-latest, step: tests-bs1-c}
          - {os: ubuntu-latest, step: tests-bs1-d}
          - {os: ubuntu-latest, step: tests-bs1-e}
          - {os: ubuntu-latest, step: tests-bs1-f}
          - {os: ubuntu-latest, step: tests-lv1}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ensure-dependencies.mjs
      - run: node scripts/ci/diagnose-step.mjs ${{ matrix.step }}
