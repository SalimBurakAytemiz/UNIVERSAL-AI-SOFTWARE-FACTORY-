# //TR: YALNIZ TANI workflow'u (merge edilmez; yalniz ci/diagnose-shards dalina push ile calisir): Linux'ta tests-2 takilmasinin onceki adimlardan (statik adimlar veya tests kabugunun dosyalari) kalan durumdan kaynaklanip kaynaklanmadigini runCommand ile sirali calistirarak sinar. GitHub-hosted, secret yok, contents:read, artifact yok. Governance kaniti veya PASS DEGILDIR.
name: Diagnose tests-2 hang after earlier steps (diagnosis only)
on:
  push:
    branches: [ci/diagnose-shards]
permissions:
  contents: read
jobs:
  seq:
    name: seq pre=${{ matrix.pre }} #${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pre: "tests", n: 1}
          - {pre: "tests", n: 2}
          - {pre: "tests", n: 3}
          - {pre: "tests", n: 4}
          - {pre: "tests", n: 5}
          - {pre: "tests", n: 6}
          - {pre: "tests", n: 7}
          - {pre: "tests", n: 8}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ensure-dependencies.mjs
      - run: node scripts/ci/diagnose-seq.mjs "${{ matrix.pre }}"
