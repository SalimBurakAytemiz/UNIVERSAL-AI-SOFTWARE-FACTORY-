# //TR: Bu workflow Linux + Windows üzerinde deterministic lockfile install, full canonical/mechanical validation ve baseline secret scan çalıştırarak Windows Founder ortamına özgü script/path hatalarının yalnız Linux CI'da saklanmasını engeller.
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require lockfile
        shell: bash
        run: test -f package-lock.json || (echo "package-lock.json missing; run install/bootstrap once and commit lockfile" && exit 1)
      - run: npm ci
      - run: npm run validate
      - run: node scripts/secret-sanity.mjs
      - name: Bootstrap trust-kernel self-test
        run: node scripts/bootstrap-kernel-selftest.mjs
