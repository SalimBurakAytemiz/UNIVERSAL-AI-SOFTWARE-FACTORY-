# //TR: YALNIZ TANI workflow'u (merge edilmez; yalniz ci/diagnose-elevation dalina push ile calisir): GitHub-hosted Windows runner'in yukseltilmis (Administrator) calistigini ve BS1 bootstrap selftest'inin yukseltilmemis bir baglamda (runas /trustlevel Basic User veya gecici standart yerel kullanici) calistirilip calistirilamayacagini sinar. Secret yok, contents:read, artifact yok. Governance kaniti veya PASS DEGILDIR.
name: Diagnose Windows elevation for BS1 (diagnosis only)
on:
  push:
    branches: [ci/diagnose-elevation]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ensure-dependencies.mjs
      - name: PID reuse probe
        run: node scripts/ci/diag-pid-reuse.mjs
      - name: LV1 original (protected) selftest x2 and fixture-patched diagnostic copy x3
        shell: pwsh
        run: |
          foreach ($i in 1,2) { node scripts/liveness-selftest.mjs 2>&1 | Select-Object -Last 1; "LV1_ORIGINAL run=$i exit=$LASTEXITCODE" }
          foreach ($i in 1,2,3) { node scripts/diag-liveness-selftest-fixture.mjs 2>&1 | Select-Object -Last 1; "LV1_PATCHED run=$i exit=$LASTEXITCODE" }
      - name: Bootstrap trust-kernel self-test (post-validation CI step)
        run: node scripts/bootstrap-kernel-selftest.mjs
