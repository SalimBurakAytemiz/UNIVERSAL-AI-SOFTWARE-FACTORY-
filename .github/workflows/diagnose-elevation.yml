# //TR: YALNIZ TANI workflow'u (merge edilmez; yalniz ci/diagnose-elevation dalina push ile calisir): GitHub-hosted Windows runner'in yukseltilmis (Administrator) calistigini ve BS1 bootstrap selftest'inin yukseltilmemis bir baglamda (runas /trustlevel Basic User veya gecici standart yerel kullanici) calistirilip calistirilamayacagini sinar. Secret yok, contents:read, artifact yok. Governance kaniti veya PASS DEGILDIR.
name: Diagnose Windows elevation for BS1 (diagnosis only)
on:
  push:
    branches: [ci/diagnose-elevation]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ensure-dependencies.mjs
      - name: BS1 shards a-f through the patched harness (de-elevated via runas on this hosted runner)
        shell: pwsh
        run: |
          $fail = 0
          foreach ($s in 'a','b','c','d','e','f') {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            node node_modules/vitest/vitest.mjs run "tests/pkg-bs1-autonomy-bootstrap-$s.test.ts" 2>&1 | Select-Object -Last 40
            $rc = $LASTEXITCODE; if ($rc -ne 0) { $fail++ }
            "BS1_SHARD $s exit=$rc seconds=" + [int]$sw.Elapsed.TotalSeconds
          }
          node node_modules/vitest/vitest.mjs run tests/pkg-vs-validation-sharding.test.ts 2>&1 | Select-Object -Last 8
          "BS1_DIAG failures=$fail"
