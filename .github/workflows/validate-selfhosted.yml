# //TR: Ucretsiz self-hosted CI (GitHub-hosted kota 2000/2000 dolu, ek faturalandirma YASAK). Yalniz 'uasco-ci' etiketli runner'i (UASCO-CI standart hesabi) hedefler; eski runner bu isleri ALMAZ. GUVENLIK: pull_request ile OTOMATIK CALISMAZ; yalniz elle workflow_dispatch (varsayilan branch 'master'da) veya yalniz 'ci/selfhosted-run' branch'ine bilincli push ile calisir (ikisi de repo yazma yetkisi ister). Free planda private repo environment onay kapisi bulunmadigindan insan kapisi = bilincli tetikleme. En az yetki: contents:read, secret yok, persist-credentials:false. Zorunlu kapsam korunur: ensure-dependencies + run-validation + secret-sanity + bootstrap-kernel-selftest (Node 24); adim sureleri 600 sn limitine karsi raporlanir. Korunan .github/workflows/ci.yml'e DOKUNMAZ.
name: CI (self-hosted)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which self-hosted leg to run"
        type: choice
        default: windows
        options: [windows, linux, both]
  push:
    branches: [ci/selfhosted-run]

permissions:
  contents: read

concurrency:
  group: ci-selfhosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    name: validate (windows)
    # Job-level `if` may only use github/needs/vars/inputs contexts (not matrix).
    if: ${{ github.event_name == 'push' || inputs.target == 'windows' || inputs.target == 'both' }}
    runs-on: [self-hosted, windows, uasco-ci]
    timeout-minutes: 120
    steps:
      - name: Checkout (no persisted credentials, clean, no submodules)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: true
          submodules: false
      - name: Setup Node 24 (runner tool cache; no system-wide install)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Preflight (Node >= 24, lockfile, runner identity)
        run: node scripts/ci-runner/ci-preflight.mjs
      - name: Ensure dependencies (reviewed state)
        run: node scripts/ensure-dependencies.mjs
      - name: Canonical validation (platform-filtered)
        run: node scripts/run-validation.mjs
      - name: Secret sanity
        run: node scripts/secret-sanity.mjs
      - name: Bootstrap trust-kernel self-test
        run: node scripts/bootstrap-kernel-selftest.mjs
      - name: Per-step durations vs the 600s per-step cap
        if: always()
        run: node scripts/ci-runner/ci-report-durations.mjs

  validate-linux:
    name: validate (linux)
    # Linux leg only on explicit dispatch until a [self-hosted, linux, uasco-ci] runner exists (see runbook).
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'linux' || inputs.target == 'both') }}
    runs-on: [self-hosted, linux, uasco-ci]
    timeout-minutes: 120
    steps:
      - name: Checkout (no persisted credentials, clean, no submodules)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: true
          submodules: false
      - name: Setup Node 24 (runner tool cache; no system-wide install)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Preflight (Node >= 24, lockfile, runner identity)
        run: node scripts/ci-runner/ci-preflight.mjs
      - name: Ensure dependencies (reviewed state)
        run: node scripts/ensure-dependencies.mjs
      - name: Canonical validation (platform-filtered)
        run: node scripts/run-validation.mjs
      - name: Secret sanity
        run: node scripts/secret-sanity.mjs
      - name: Bootstrap trust-kernel self-test
        run: node scripts/bootstrap-kernel-selftest.mjs
      - name: Per-step durations vs the 600s per-step cap
        if: always()
        run: node scripts/ci-runner/ci-report-durations.mjs
